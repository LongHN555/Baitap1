<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 2 - Gọi API Node-RED</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        ul { list-style-type: square; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Danh sách sinh viên từ API Node-RED</h2>
    <button onclick="fetchData()">Tải dữ liệu API</button>
    
    <p id="status"></p>
    <ul id="student-list"></ul>

    <script>
        function fetchData() {
            // Gọi API bằng Fetch JS
            fetch('/api/')
                .then(response => response.json())
                .then(data => {
                    if (data.ok === 1) {
                        document.getElementById('status').innerText = "Trạng thái: " + data.msg;
                        document.getElementById('status').className = "success";

                        let listElement = document.getElementById('student-list');
                        listElement.innerHTML = ''; // Xóa danh sách cũ

                        // Lặp qua mảng dssv và hiển thị lên giao diện
                        data.dssv.forEach(sv => {
                            let li = document.createElement('li');
                            li.textContent = `Tên: ${sv.name} - Số tiền: ${sv.money}`;
                            listElement.appendChild(li);
                        });
                    }
                })
                .catch(error => {
                    console.error('Lỗi khi gọi API:', error);
                    document.getElementById('status').innerText = 'Lỗi kết nối API!';
                });
        }

        // Tự động gọi API khi tải trang
       // window.onload = fetchData;
    </script>
</body>
</html>
